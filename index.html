
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cofe — Conservation of Energy</title>
    <link rel="stylesheet" href="style.css">
	
    <link rel="manifest" href="./manifest.json">

</head>
<body>

<!-- Fullscreen astronomical background -->
<div class="sky" id="sky">
    <div class="sky-layer sky-night"></div>
    <div class="sky-layer sky-dawn"></div>
    <div class="sky-layer sky-day"></div>
    <div class="sky-layer sky-dusk"></div>
    <div class="stars" id="stars"></div>
</div>

<main class="app">

    
<header class="header">
    <button class="menu-button"
            id="menu-button"
            type="button"
            aria-label="Menu"
            aria-expanded="false">⋮</button>

    <nav id="main-menu" class="main-menu hidden">
        <button id="open-profile" type="button">
            Profile
        </button>

        <button id="open-journal" type="button">
            Journal
        </button>
    </nav>
</header>



    <div id="home-screen">
    <section class="balance-card">

        <!-- Main energy balance -->
        <div class="balance-value">
            <span id="counter"></span>
            <span class="balance-unit">kcal</span>
        </div>

        <!-- Astronomical arc and energy horizon -->
        <div class="sky-scene">

            <svg class="sky-arc"
                 viewBox="0 0 600 230"
                 preserveAspectRatio="none"
                 aria-hidden="true">

                <path
                    id="time-arc"
                    d="M 0 210 Q 300 -170 600 210"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-dasharray="4 7"
                />
            </svg>

            <div id="celestial-body">
                <div class="sun"></div>
                <div class="moon"></div>
            </div>

            <div class="balance-scale">
                <div class="scale-center"></div>
                <div id="scale-marker"></div>
            </div>

        </div>

        <!-- Energy statistics -->
        <div class="stats">

            <div class="stat-out">
                <strong id="burned"></strong>
                <small>kcal</small>
            </div>

            <div class="stat-in">
                <strong id="eaten"></strong>
                <small>kcal</small>
            </div>

        </div>
    </section>
	
	

    <!-- One button opens the shared IN / OUT form -->
    <div class="action-buttons">
        <button id="open-entry" class="add-entry-button" type="button"
                aria-label="Add energy entry" aria-expanded="false">+</button>
    </div>
	
	
	<div class="cofe-signature">
        <span>C</span>onservation
        <span>of</span>
        <span>e</span>nergy
    </div>

    
	</div>
<form id="energy-form" class="energy-form hidden">
        <div class="entry-heading">
            <h2>Energy entry</h2>
            <button id="close-entry" type="button" aria-label="Close form">×</button>
        </div>

        <fieldset class="entry-type">
            <legend>Type</legend>
            <label><input type="radio" name="entry-type" value="in" checked> IN</label>
            <label><input type="radio" name="entry-type" value="out"> OUT</label>
        </fieldset>

        <label for="energy-description">Food / Activity</label>
        <textarea id="energy-description" placeholder="What did you eat or do?"
                  maxlength="200" rows="3" required></textarea>

        <label for="calories">Energy (kcal)</label>
        <input type="number" id="calories" placeholder="e.g. 450"
               min="0.01" step="any" required>

        <p class="entry-hint">Date and time are recorded automatically.</p>
        <p id="entry-status" class="entry-status" role="status"></p>
        <button id="add-energy" class="entry-save" type="submit">Save entry</button>
    </form>
	
	
<!-- ===== PROFILE SCREEN ===== -->

<section id="profile-screen" class="profile-screen hidden">

    <div class="profile-header">
        <button id="close-profile" type="button">
            ← Back
        </button>

        <h2>Profile</h2>
    </div>

    <form id="profile-form">

        <label for="profile-sex">Sex</label>
        <select id="profile-sex" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <label for="profile-birth">Date of birth</label>
        <input id="profile-birth" type="date" required>

        <label for="profile-height">Height (cm)</label>
        <input id="profile-height"
               type="number"
               min="50"
               max="250"
               required>

        <label for="profile-weight">Weight (kg)</label>
        <input id="profile-weight"
               type="number"
               min="20"
               max="400"
               step="0.1"
               required>

<button type="submit" class="profile-save">
            Save
        </button>

    </form>

</section>


</main>

<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
